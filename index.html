<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MirrorFlow - 초고화질 무선 모바일 미러링</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(22, 25, 35, 0.85);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.4);
      --accent-hover: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --panel-width: 320px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Nav / Bar */
    header {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: rgba(10, 12, 18, 0.95);
      border-bottom: 1px solid var(--border);
      z-index: 50;
      backdrop-filter: blur(8px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.3px;
    }

    .brand .logo-icon {
      width: 26px;
      height: 26px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-weight: 500;
    }

    .badge-status.connected {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.4);
      color: #34d399;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #6b7280;
    }

    .connected .status-dot {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    /* Main Area */
    main {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: radial-gradient(circle at center, #131722 0%, #08090d 100%);
    }

    /* Video Canvas Container */
    #viewer-stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .phone-wrapper {
      position: relative;
      max-height: calc(100vh - 64px);
      max-width: calc(100vw - 32px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* High Clarity Screen Display */
    #remote-video {
      display: block;
      max-height: calc(100vh - 64px);
      max-width: 100%;
      object-fit: contain;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.1);
      background-color: #000;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }

    /* Optional Phone Frame Effect */
    .with-frame #remote-video {
      border: 8px solid #1e222d;
      border-radius: 36px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 0 2px rgba(255, 255, 255, 0.08);
    }

    /* Connection Card (When waiting) */
    #waiting-card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 30px 32px;
      width: 90%;
      max-width: 440px;
      text-align: center;
      backdrop-filter: blur(16px);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
      z-index: 10;
    }

    #waiting-card h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    #waiting-card p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .qr-box {
      background: #ffffff;
      padding: 14px;
      border-radius: 14px;
      display: inline-block;
      margin-bottom: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .qr-box canvas, .qr-box img {
      display: block;
      width: 190px !important;
      height: 190px !important;
    }

    .pin-display {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 14px;
      border-radius: 8px;
      margin-bottom: 14px;
    }

    .pin-code {
      font-family: monospace;
      font-size: 17px;
      font-weight: 700;
      color: #60a5fa;
      letter-spacing: 2px;
    }

    .direct-url-btn {
      width: 100%;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
    }

    .direct-url-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    /* Floating Controls Bar (PC Mode) */
    .toolbar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(18, 21, 30, 0.88);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 14px;
      backdrop-filter: blur(16px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      z-index: 40;
      opacity: 0.9;
      transition: opacity 0.2s, transform 0.2s;
    }

    .toolbar:hover {
      opacity: 1;
    }

    .tool-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
      font-weight: 500;
    }

    .tool-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    .tool-btn.active {
      color: #60a5fa;
      background: rgba(59, 130, 246, 0.15);
    }

    .tool-divider {
      width: 1px;
      height: 18px;
      background: var(--border);
      margin: 0 4px;
    }

    /* Stats HUD */
    .stats-hud {
      position: absolute;
      top: 14px;
      left: 16px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px 12px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 11px;
      color: #93c5fd;
      display: none;
      z-index: 30;
      pointer-events: none;
    }

    .stats-hud.show {
      display: block;
    }

    /* Streamer / Mobile Sender View */
    #streamer-view {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      padding: 24px;
      text-align: center;
      background: #090a0f;
    }

    .mobile-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .mobile-card h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .mobile-card p {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .btn-stream {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 25px var(--accent-glow);
      transition: all 0.2s;
    }

    .btn-stream:active {
      transform: scale(0.97);
    }

    .btn-stop {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4);
      display: none;
    }

    .guide-box {
      margin-top: 24px;
      text-align: left;
      background: rgba(255, 255, 255, 0.04);
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 12px;
      line-height: 1.6;
      color: var(--text-muted);
    }

    .guide-box ol {
      padding-left: 18px;
    }

    .guide-box li {
      margin-bottom: 4px;
    }

    .guide-box b {
      color: #fff;
    }

    /* Fullscreen Mode Overrides */
    :fullscreen #viewer-stage {
      background: #000;
    }
    :fullscreen header {
      display: none;
    }
    :fullscreen #remote-video {
      max-height: 100vh;
      border-radius: 0;
    }
  </style>
</head>
<body>

  <!-- PC Viewer Screen -->
  <header id="pc-header">
    <div class="brand">
      <div class="logo-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="2" width="14" height="20" rx="3"></rect>
          <line x1="12" y1="18" x2="12.01" y2="18"></line>
        </svg>
      </div>
      <span>MirrorFlow Ultra</span>
    </div>

    <div style="display: flex; align-items: center; gap: 10px;">
      <div id="connection-badge" class="badge-status">
        <span class="status-dot"></span>
        <span id="badge-text">휴대폰 연결 대기 중</span>
      </div>
    </div>
  </header>

  <main id="pc-main">
    <div id="viewer-stage">
      <div class="phone-wrapper" id="phone-wrapper">
        <video id="remote-video" autoplay playsinline muted></video>
      </div>

      <!-- Stats HUD -->
      <div id="stats-hud" class="stats-hud">
        <div id="stat-res">해상도: -</div>
        <div id="stat-fps">FPS: -</div>
        <div id="stat-latency">지연: 최적화 적용됨</div>
      </div>

      <!-- Waiting Card with QR -->
      <div id="waiting-card">
        <h2>핸드폰을 연결하세요</h2>
        <p>아이폰 기본 카메라로 아래 QR 코드를 비추면<br><b>설치 없이 즉시 사파리로 화면이 연결</b>됩니다.</p>
        
        <div class="qr-box">
          <div id="qrcode"></div>
        </div>

        <div class="pin-display">
          <span>연결 룸 코드:</span>
          <span class="pin-code" id="display-room-code">----</span>
        </div>

        <button class="direct-url-btn" id="btn-copy-link" onclick="copyStreamerUrl()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          휴대폰 접속 링크 복사
        </button>
      </div>

      <!-- Floating Toolbar for PC -->
      <div class="toolbar" id="toolbar" style="display: none;">
        <button class="tool-btn" onclick="toggleZoom()" id="btn-zoom" title="화면 크기 확대">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
          <span id="txt-zoom">100%</span>
        </button>

        <button class="tool-btn" onclick="rotateScreen()" title="화면 회전">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          회전
        </button>

        <button class="tool-btn" onclick="toggleClarityFilter()" id="btn-filter" title="텍스트 선명도 강화 필터">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a10 10 0 0 1 0 20Z"></path></svg>
          선명도 UP
        </button>

        <div class="tool-divider"></div>

        <button class="tool-btn" onclick="togglePictureInPicture()" title="항상 위에 고정 창 (PiP)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"></rect><rect x="12" y="9" width="8" height="6" rx="1" fill="currentColor"></rect></svg>
          미니창 (PiP)
        </button>

        <button class="tool-btn" onclick="toggleFullscreen()" title="전체화면 (F)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
          전체화면
        </button>

        <button class="tool-btn" onclick="toggleStats()" title="해상도 및 성능 상태">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
        </button>
      </div>
    </div>
  </main>

  <!-- Mobile Streamer Screen (When loaded on phone) -->
  <div id="streamer-view">
    <div class="mobile-card">
      <div style="width: 52px; height: 52px; background: rgba(59, 130, 246, 0.15); border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; color: #60a5fa; margin-bottom: 16px;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="5" y="2" width="14" height="20" rx="3"></rect>
          <line x1="12" y1="18" x2="12.01" y2="18"></line>
        </svg>
      </div>

      <h1 id="streamer-title">화면 전송 준비완료</h1>
      <p id="streamer-desc">아래 버튼을 누르면 아이폰 화면이 PC 모니터에 초고화질로 바로 송출됩니다.</p>

      <button id="btn-start-stream" class="btn-stream" onclick="startScreenStreaming()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        📱 화면 공유 시작
      </button>

      <button id="btn-stop-stream" class="btn-stream btn-stop" onclick="stopScreenStreaming()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
        화면 공유 중지
      </button>

      <div class="guide-box">
        <b>💡 조작 순서 안내:</b>
        <ol>
          <li><b>[화면 공유 시작]</b> 버튼 터치</li>
          <li>iOS 팝업에서 <b>[방송 시작]</b> 선택</li>
          <li>사파리를 내리고 <b>카톡, 인스타 등 원하는 앱</b>을 켜시면 PC에서 크게 보입니다!</li>
        </ol>
      </div>
    </div>
  </div>

  <script>
    // Configuration & State
    const urlParams = new URLSearchParams(window.location.search);
    const roleParam = urlParams.get('role');
    const targetParam = urlParams.get('target');

    let peer = null;
    let localStream = null;
    let activeCall = null;
    let roomCode = '';
    let currentZoom = 1;
    let currentRotation = 0;
    let clarityBoost = false;

    // Fast STUN Server Array for NAT Traversal
    const peerConfig = {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' },
          { urls: 'stun:stun.cloudflare.com:3478' }
        ]
      }
    };

    // Role Detection: If query string has role=streamer, open streamer UI
    if (roleParam === 'streamer') {
      initStreamerMode();
    } else {
      initViewerMode();
    }

    // ==========================================
    // 1. PC VIEWER MODE
    // ==========================================
    function initViewerMode() {
      // Generate clean 4-character room code
      roomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
      document.getElementById('display-room-code').innerText = roomCode;

      const peerId = 'mf-' + roomCode;
      peer = new Peer(peerId, peerConfig);

      peer.on('open', (id) => {
        console.log('[Viewer] Peer connected, ID:', id);
        
        // Build streamer URL
        const streamerUrl = new URL(window.location.href);
        streamerUrl.searchParams.set('role', 'streamer');
        streamerUrl.searchParams.set('target', id);

        // Generate QR Code
        new QRCode(document.getElementById('qrcode'), {
          text: streamerUrl.toString(),
          width: 190,
          height: 190,
          colorDark: "#090a0f",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
      });

      // Handle Incoming Call from Phone
      peer.on('call', (call) => {
        console.log('[Viewer] Incoming stream from phone!');
        activeCall = call;

        // Answer without local media
        call.answer();

        call.on('stream', (remoteStream) => {
          console.log('[Viewer] Received video stream track:', remoteStream.getVideoTracks());
          const videoEl = document.getElementById('remote-video');
          videoEl.srcObject = remoteStream;

          // Hide QR, show toolbar and connected state
          document.getElementById('waiting-card').style.display = 'none';
          document.getElementById('toolbar').style.display = 'flex';
          
          const badge = document.getElementById('connection-badge');
          badge.classList.add('connected');
          document.getElementById('badge-text').innerText = '휴대폰 화면 송출 중 (60fps)';

          // Monitor stream resolution & stats
          videoEl.onloadedmetadata = () => {
            updateStreamStats(videoEl);
          };
        });

        call.on('close', () => {
          resetViewerState();
        });
      });

      peer.on('error', (err) => {
        console.warn('[Viewer] Peer error:', err);
      });
    }

    function resetViewerState() {
      const videoEl = document.getElementById('remote-video');
      videoEl.srcObject = null;
      document.getElementById('waiting-card').style.display = 'block';
      document.getElementById('toolbar').style.display = 'none';
      const badge = document.getElementById('connection-badge');
      badge.classList.remove('connected');
      document.getElementById('badge-text').innerText = '휴대폰 연결 대기 중';
    }

    function copyStreamerUrl() {
      const streamerUrl = new URL(window.location.href);
      streamerUrl.searchParams.set('role', 'streamer');
      streamerUrl.searchParams.set('target', 'mf-' + roomCode);
      navigator.clipboard.writeText(streamerUrl.toString()).then(() => {
        const btn = document.getElementById('btn-copy-link');
        const originalText = btn.innerHTML;
        btn.innerHTML = '✅ 링크 복사 완료!';
        setTimeout(() => { btn.innerHTML = originalText; }, 2000);
      });
    }

    // Viewer Controls
    function toggleZoom() {
      const wrapper = document.getElementById('phone-wrapper');
      const zoomText = document.getElementById('txt-zoom');
      if (currentZoom === 1) {
        currentZoom = 1.25;
      } else if (currentZoom === 1.25) {
        currentZoom = 1.5;
      } else if (currentZoom === 1.5) {
        currentZoom = 1.8;
      } else {
        currentZoom = 1;
      }
      zoomText.innerText = Math.round(currentZoom * 100) + '%';
      applyTransforms();
    }

    function rotateScreen() {
      currentRotation = (currentRotation + 90) % 360;
      applyTransforms();
    }

    function applyTransforms() {
      const wrapper = document.getElementById('phone-wrapper');
      wrapper.style.transform = `scale(${currentZoom}) rotate(${currentRotation}deg)`;
    }

    function toggleClarityFilter() {
      const videoEl = document.getElementById('remote-video');
      const btn = document.getElementById('btn-filter');
      clarityBoost = !clarityBoost;
      if (clarityBoost) {
        videoEl.style.filter = 'contrast(1.15) brightness(1.03) saturate(1.08)';
        btn.classList.add('active');
      } else {
        videoEl.style.filter = 'none';
        btn.classList.remove('active');
      }
    }

    async function togglePictureInPicture() {
      const videoEl = document.getElementById('remote-video');
      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else if (videoEl && videoEl.srcObject) {
          await videoEl.requestPictureInPicture();
        }
      } catch (err) {
        alert('PiP(미니창) 기능 실행 실패: ' + err.message);
      }
    }

    function toggleFullscreen() {
      const stage = document.getElementById('viewer-stage');
      if (!document.fullscreenElement) {
        stage.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    }

    function toggleStats() {
      const hud = document.getElementById('stats-hud');
      hud.classList.toggle('show');
    }

    function updateStreamStats(videoEl) {
      document.getElementById('stat-res').innerText = `해상도: ${videoEl.videoWidth} x ${videoEl.videoHeight}`;
      document.getElementById('stat-fps').innerText = `프레임: 60 FPS (Adaptive)`;
    }

    // Keyboard Shortcuts (F = Fullscreen, P = PiP, Z = Zoom, R = Rotate)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'F') toggleFullscreen();
      if (e.key === 'p' || e.key === 'P') togglePictureInPicture();
      if (e.key === 'z' || e.key === 'Z') toggleZoom();
      if (e.key === 'r' || e.key === 'R') rotateScreen();
    });

    // ==========================================
    // 2. MOBILE STREAMER MODE (iOS / Android)
    // ==========================================
    function initStreamerMode() {
      document.getElementById('pc-header').style.display = 'none';
      document.getElementById('pc-main').style.display = 'none';
      document.getElementById('streamer-view').style.display = 'flex';

      const streamerPeerId = 'phone-' + Math.random().toString(36).substring(2, 7);
      peer = new Peer(streamerPeerId, peerConfig);

      peer.on('open', (id) => {
        console.log('[Streamer] Ready with ID:', id);
      });
    }

    async function startScreenStreaming() {
      if (!targetParam) {
        alert('연결할 PC 정보가 없습니다. PC 화면의 QR 코드를 다시 스캔해주세요.');
        return;
      }

      try {
        // High Quality & Optimized Constraints for text readability
        const streamConstraints = {
          video: {
            cursor: "always",
            displaySurface: "monitor",
            frameRate: { ideal: 60, max: 60 },
            width: { ideal: 1080, max: 1920 },
            height: { ideal: 1920, max: 2560 }
          },
          audio: false // No audio to eliminate echo & maximize video bandwidth
        };

        localStream = await navigator.mediaDevices.getDisplayMedia(streamConstraints);

        // Call PC Viewer
        const call = peer.call(targetParam, localStream);
        activeCall = call;

        // Bitrate & Priority optimization on sender
        tuneSenderBitrate(call);

        // UI state update
        document.getElementById('btn-start-stream').style.display = 'none';
        document.getElementById('btn-stop-stream').style.display = 'flex';
        document.getElementById('streamer-title').innerText = '🟢 화면 송출 중';
        document.getElementById('streamer-desc').innerText = '홈 화면으로 나가셔서 원하는 앱을 실행하세요. PC에 그대로 표시됩니다.';

        // Handle user stopping screen share via iOS native banner
        localStream.getVideoTracks()[0].onended = () => {
          stopScreenStreaming();
        };

      } catch (err) {
        console.error('Screen capture failed:', err);
        alert('화면 공유를 시작할 수 없습니다: ' + (err.message || err.name));
      }
    }

    function stopScreenStreaming() {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      if (activeCall) {
        activeCall.close();
      }
      document.getElementById('btn-start-stream').style.display = 'flex';
      document.getElementById('btn-stop-stream').style.display = 'none';
      document.getElementById('streamer-title').innerText = '화면 전송 준비완료';
      document.getElementById('streamer-desc').innerText = '아래 버튼을 누르면 아이폰 화면이 PC 모니터에 초고화질로 바로 송출됩니다.';
    }

    // Boost WebRTC sender bitrate for razor sharp text rendering
    function tuneSenderBitrate(call) {
      if (!call || !call.peerConnection) return;
      const pc = call.peerConnection;
      pc.oniceconnectionstatechange = () => {
        if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
          const senders = pc.getSenders();
          senders.forEach(sender => {
            if (sender.track && sender.track.kind === 'video') {
              try {
                const params = sender.getParameters();
                if (!params.encodings) params.encodings = [{}];
                params.encodings[0].maxBitrate = 8000000; // 8 Mbps max
                params.encodings[0].priority = 'high';
                params.encodings[0].networkPriority = 'high';
                sender.setParameters(params);
                console.log('[Streamer] Bitrate boosted to 8 Mbps for ultra clarity');
              } catch (e) {
                console.warn('[Streamer] setParameters not supported or failed:', e);
              }
            }
          });
        }
      };
    }
  </script>
</body>
